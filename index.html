<!DOCTYPE html>
<html>
<head>
    <title>Path of Layout 2</title>
    <style>
        body {
		    color:#FFFFFF;
	        background:#323232;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 40px;
        }

        .image-container {
            width: 900px;
            height: 550px;
            margin: 0 auto 20px auto;
            border: 2px solid #333;
            overflow: hidden;
            position: relative;
            background-color:#000000;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.1s ease;
            user-select: none;         
            -webkit-user-drag: none;   
            cursor: grab;
        }

        button {
            background-color: #f4c430;
            color: #111;
	    	font-size: 18px;
            font-weight: bold;
            border: none;
            padding: 12px 22px;
            margin: 5px;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }

        button:hover {
            background-color: #ffdb4d;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0px);
        }
    </style>
</head>
<body>

    <h1>Clearfell Map Layouts</h2>

    <div class="image-container">
        <img id="imageViewer" src="Images/clearfell/Clearfell01.png" alt="Image Viewer">
    </div>
	<span>Use mousewheel over the map to zoom in and out, and drag the map around.</span>
	<br><br>

    <button onclick="prevImage()">Previous</button>
    <button onclick="nextImage()">Next</button>
    <button onclick="resetZoom()">Reset Zoom</button>

    <script>
        const images = [
            "Images/clearfell/Clearfell01.png",
            "Images/clearfell/Clearfell02.png"
        ];

        let currentIndex = 0;
        let scale = 1;

        let isDragging = false;
        let startX, startY;
        let translateX = 0;
        let translateY = 0;

        const img = document.getElementById("imageViewer");
        img.setAttribute("draggable", "false"); // Disable default drag

        function updateTransform() {
            img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function showImage() {
            img.src = images[currentIndex];
            resetZoom();
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            showImage();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showImage();
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        }

        // Zoom with mouse wheel
        img.addEventListener("wheel", function(e) {
            e.preventDefault();

            if (e.deltaY < 0) {
                scale += 0.1;
            } else {
                scale -= 0.1;
            }

            scale = Math.min(Math.max(1, scale), 5);
            updateTransform();
        });

        // Start dragging
        img.addEventListener("mousedown", function(e) {
            if (scale <= 1) return;

            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            img.style.cursor = "grabbing";
        });

        // Drag movement
        window.addEventListener("mousemove", function(e) {
            if (!isDragging) return;

            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });

        // Stop dragging
        window.addEventListener("mouseup", function() {
            isDragging = false;
            img.style.cursor = scale > 1 ? "grab" : "default";
        });
    </script>

</body>
</html>
