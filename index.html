<!DOCTYPE html>
<html>
<head>
    <title>Path of Layout 2</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 40px;
        }

        .image-container {
            width: 500px;
            height: 350px;
            margin: 0 auto 20px auto;
            border: 2px solid #333;
            overflow: hidden;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.1s ease;
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Clearfell Map Layouts</h2>

    <div class="image-container">
        <img id="imageViewer" src="Images/clearfell/Clearfell01.png" alt="Image Viewer">
    </div>

    <button onclick="prevImage()">Previous</button>
    <button onclick="nextImage()">Next</button>
    <button onclick="resetZoom()">Reset Zoom</button>

    <script>
        const images = [
            "Images/clearfell/Clearfell01.png",
            "Images/clearfell/Clearfell02.png"
        ];

        let currentIndex = 0;
        let scale = 1;
        const img = document.getElementById("imageViewer");

        function showImage() {
            img.src = images[currentIndex];
            resetZoom();
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            showImage();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showImage();
        }

        function resetZoom() {
            scale = 1;
            img.style.transform = `scale(${scale})`;
        }

        // Zoom with mouse wheel
        img.addEventListener("wheel", function(e) {
            e.preventDefault();

            if (e.deltaY < 0) {
                scale += 0.1; // zoom in
            } else {
                scale -= 0.1; // zoom out
            }

            // Limit zoom level
            scale = Math.min(Math.max(1, scale), 5);

            img.style.transform = `scale(${scale})`;
        });
    </script>

</body>
</html>
